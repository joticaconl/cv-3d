<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - CV 3D</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #09090b; color: white; padding: 2rem; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    h1 { margin: 0; font-weight: 900; color: #f59e0b; }
    table { width: 100%; border-collapse: collapse; background: #111113; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    th, td { padding: 1.2rem; border-bottom: 1px solid #27272a; text-align: left; }
    th { background: #18181b; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #a1a1aa; }
    button { background: #f59e0b; color: #09090b; border: none; padding: 0.6rem 1.2rem; font-weight: bold; cursor: pointer; border-radius: 8px; transition: opacity 0.2s; }
    button:hover { opacity: 0.8; }
    button.delete { background: #ef4444; color: white; margin-left: 0.5rem; }
    .status { font-size: 0.8rem; font-weight: bold; padding: 0.3rem 0.6rem; border-radius: 4px; text-transform: uppercase; }
    .status.pending { background: rgba(24cd, 213, 53, 0.1); color: #fcd535; border: 1px solid rgba(252, 213, 53, 0.2); }
    .status.approved { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
    .stat-card { background: #18181b; padding: 1.5rem; border-radius: 12px; border: 1px solid #27272a; margin-bottom: 2rem; display: inline-block;}
    .stat-value { font-size: 2rem; font-weight: 900; font-family: monospace; color: #f59e0b; margin-top: 0.5rem; }
    .auth-bar { display: flex; gap: 1rem; align-items: center; }
  </style>
</head>
<body>
  
  <div class="header">
    <div>
      <h1>Confirmación de Pagos (Admin)</h1>
      <span style="font-size: 0.8rem; color: #10b981;">🛡️ Blindaje Nivel 0.00001% (HMAC Anti-Replay + Edge KV)</span>
    </div>
    <div class="auth-bar">
      <button onclick="setAdminToken()" style="background: #27272a; color: #e4e4e7;">Cambiar Token</button>
      <a href="/" style="color: #a1a1aa; text-decoration: none;">Volver al CV</a>
    </div>
  </div>

  <div class="stat-card">
    <div style="font-size: 0.8rem; font-weight: bold; color: #a1a1aa; text-transform: uppercase;">Total Recaudado (Aprobados)</div>
    <div class="stat-value" id="total-raised">$0</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Fecha / ID</th>
        <th>Nombre / Marca</th>
        <th>Aporte ($)</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Inyectado via JS -->
    </tbody>
  </table>

  <script>
    const backendUrl = '/api';

    function getAdminToken() {
      let token = sessionStorage.getItem('cv_admin_token');
      if (!token) {
        token = prompt('🔐 Ingresa tu Clave / Token de Administrador:');
        if (token) {
          sessionStorage.setItem('cv_admin_token', token.trim());
        }
      }
      return token;
    }

    function setAdminToken() {
      const token = prompt('🔐 Ingresa el nuevo Token de Administrador:');
      if (token) {
        sessionStorage.setItem('cv_admin_token', token.trim());
        load();
      }
    }

    async function createSignedHeaders(method, pathname, token) {
      const timestamp = String(Date.now());
      const nonce = Math.random().toString(36).substring(2, 15);
      const enc = new TextEncoder();
      
      try {
        const key = await crypto.subtle.importKey(
          'raw',
          enc.encode(token),
          { name: 'HMAC', hash: 'SHA-256' },
          false,
          ['sign']
        );
        const signature = await crypto.subtle.sign('HMAC', key, enc.encode(`${method}:${pathname}:${timestamp}:${nonce}`));
        const sigHex = Array.from(new Uint8Array(signature), b => b.toString(16).padStart(2, '0')).join('');

        return {
          'Authorization': `Bearer ${token}`,
          'X-Signature': sigHex,
          'X-Timestamp': timestamp,
          'X-Nonce': nonce,
        };
      } catch {
        return { 'Authorization': `Bearer ${token}` };
      }
    }

    async function load() {
      try {
        const res = await fetch(`${backendUrl}/stickers`);
        const stickers = await res.json();
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        
        let raised = 0;

        // Sort: pending first, then latest
        stickers.sort((a, b) => {
          if (a.status === 'pending' && b.status === 'approved') return -1;
          if (a.status === 'approved' && b.status === 'pending') return 1;
          return (b.createdAt || 0) - (a.createdAt || 0);
        });

        stickers.forEach(s => {
          if (s.id === 'yummy') return;
          if (s.status === 'approved') raised += s.price;

          const date = s.createdAt ? new Date(s.createdAt).toLocaleString() : (isNaN(Number(s.id)) ? 'Reciente' : new Date(Number(s.id)).toLocaleString());
          
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-size: 0.8rem; color: #a1a1aa;">${date}<br/><code style="color: #f59e0b;">${s.id}</code></td>
            <td><strong>${s.name}</strong></td>
            <td style="font-family: monospace; font-size: 1.2rem; font-weight: bold;">$${s.price.toLocaleString()}</td>
            <td><span class="status ${s.status}">${s.status}</span></td>
            <td>
              ${s.status === 'pending' ? `<button onclick="approve('${s.id}')">Aprobar Pago</button>` : ''}
              <button class="delete" onclick="remove('${s.id}')">Borrar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById('total-raised').innerText = '$' + raised.toLocaleString();
      } catch (err) {
        document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ef4444;">Error conectando a la API de Cloudflare KV.</td></tr>';
      }
    }

    async function approve(id) {
      const token = getAdminToken();
      if (!token) return alert('Debes proporcionar el token de administrador.');

      const pathname = `/api/stickers/${id}/approve`;
      const signedHeaders = await createSignedHeaders('PUT', pathname, token);

      const res = await fetch(`${backendUrl}/stickers/${id}/approve`, {
        method: 'PUT',
        headers: signedHeaders
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({ error: 'Error no autorizado' }));
        alert('❌ Error: ' + (data.error || 'Token o firma inválida.'));
        if (res.status === 401) {
          sessionStorage.removeItem('cv_admin_token');
        }
        return;
      }
      load();
    }

    async function remove(id) {
      if(!confirm('¿Seguro que deseas eliminar este sticker de la base de datos?')) return;
      const token = getAdminToken();
      if (!token) return alert('Debes proporcionar el token de administrador.');

      const pathname = `/api/stickers/${id}`;
      const signedHeaders = await createSignedHeaders('DELETE', pathname, token);

      const res = await fetch(`${backendUrl}/stickers/${id}`, {
        method: 'DELETE',
        headers: signedHeaders
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({ error: 'Error no autorizado' }));
        alert('❌ Error: ' + (data.error || 'Token o firma inválida.'));
        if (res.status === 401) {
          sessionStorage.removeItem('cv_admin_token');
        }
        return;
      }
      load();
    }

    load();
    // Auto refresh every 10 seconds
    setInterval(load, 10000);
  </script>
</body>
</html>
